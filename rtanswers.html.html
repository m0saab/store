<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Retro Tounes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cairo:wght@600;800&display=swap">
<style>
:root {
  /* Layout: centered column. Striped 90s header, then a shelf grid (4 / 5 / 10 columns) of painted botijos.
     Tapping a jug shakes and shatters it, then an answer card pops over a scrim. Fixed action bar at the bottom. */
  --paper: #FFFDF8;
  --white: #FFFFFF;
  --blue: #1F4FB4;
  --navy: #0F2A66;
  --red: #D6322B;
  --dot: rgba(31, 79, 180, 0.12);
  --scrim: rgba(15, 42, 102, 0.58);
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.7px);
  background-size: 20px 20px;
  color: var(--navy);
  font-family: var(--font-body);
  font-size: 16px;
  padding-inline: 16px;
  padding-block: 20px 124px;
}

/* ---------- floating 90s ---------- */
.floaters { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.f {
  position: absolute;
  font-family: var(--font-display);
  line-height: 1;
  white-space: nowrap;
  opacity: 0.1;
  transform: rotate(var(--r, 0deg));
  animation: drift var(--d, 16s) ease-in-out infinite;
}
.f.b { color: var(--blue); }
.f.r { color: var(--red); }
.f.ob { color: transparent; -webkit-text-stroke: 2px var(--blue); opacity: 0.17; }
.f.or { color: transparent; -webkit-text-stroke: 2px var(--red); opacity: 0.17; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0) rotate(var(--r, 0deg)); }
  50% { transform: translate(22px, -34px) rotate(calc(var(--r, 0deg) + 7deg)); }
}

/* ---------- header ---------- */
.wrap { position: relative; z-index: 1; max-width: 980px; margin-inline: auto; }
header { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-bottom: 22px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2.6rem, 14vw, 5rem);
  line-height: 0.95;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 .a { color: var(--blue); text-shadow: 3px 3px 0 var(--red); }
h1 .b { color: var(--red); text-shadow: 3px 3px 0 var(--blue); }
.ribbon {
  width: min(100%, 360px);
  height: 16px;
  border-block: 3px solid var(--navy);
  background: repeating-linear-gradient(90deg, var(--red) 0 22px, var(--white) 22px 44px, var(--blue) 44px 66px);
}
.tag { margin: 0; font-weight: 800; font-size: 1.1rem; }
.sub { margin: 0; font-weight: 600; font-size: 0.95rem; }

.status { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.meter { width: min(100%, 280px); height: 14px; border: 3px solid var(--navy); border-radius: 99px; background: var(--white); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--red); transition: width 0.4s ease; }
.line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 16px; font-weight: 800; }
.reset {
  font: inherit; font-size: 0.85rem; font-weight: 800; color: var(--blue);
  background: none; border: 0; border-bottom: 2px solid var(--blue); padding: 0; cursor: pointer;
}

/* ---------- shelf grid ---------- */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; margin: 0; padding: 0; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(10, 1fr); gap: 20px 14px; } }

.cell {
  appearance: none; -webkit-appearance: none;
  position: relative; display: block; width: 100%; min-width: 0;
  background: none; border: 0; border-bottom: 4px solid var(--navy); border-radius: 0;
  padding: 6px 4px 0; cursor: pointer; font: inherit; color: inherit;
  -webkit-tap-highlight-color: transparent;
}
.cell:focus-visible, .ok:focus-visible, .btn:focus-visible, .reset:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.cell.v0 { --jug: var(--blue); --band: var(--white); --label: var(--white); --ink: var(--blue); }
.cell.v1 { --jug: var(--white); --band: var(--red); --label: var(--blue); --ink: var(--white); }
.cell.v2 { --jug: var(--red); --band: var(--white); --label: var(--white); --ink: var(--red); }

.jug { position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 100 / 106; transform-origin: 50% 100%; transition: transform 0.15s ease; }
@media (hover: hover) { .cell:not(.broken):hover .jug { transform: translateY(-3px); } }
.cell:not(.broken):active .jug { transform: scale(0.96); }

.piece {
  position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
  transform-origin: 50% 100%;
  transition: opacity 0.4s ease, filter 0.4s ease;
}
.num { fill: var(--ink); font-family: var(--font-display); }
.p1 { clip-path: polygon(0 0, 55% 0, 42% 38%, 58% 62%, 30% 100%, 0 100%); }
.p2 { clip-path: polygon(55% 0, 100% 0, 100% 50%, 58% 62%, 42% 38%); }
.p3 { clip-path: polygon(58% 62%, 100% 50%, 100% 100%, 30% 100%); }

.cell.wobble .jug { animation: wobble 0.26s linear; }
@keyframes wobble {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-9deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(4deg); }
}

.cell.broken .p1 { transform: translate(-16%, 4%) rotate(-38deg) scale(0.9); }
.cell.broken .p2 { transform: translate(18%, 6%) rotate(34deg) scale(0.85); }
.cell.broken .p3 { transform: translate(2%, 8%) rotate(4deg) scale(0.8); }
.cell.broken .piece { opacity: 0.5; filter: saturate(0.7); }
.cell.broken.breaking .p1 { animation: s1 0.7s cubic-bezier(0.3, 0.7, 0.4, 1); }
.cell.broken.breaking .p2 { animation: s2 0.7s cubic-bezier(0.3, 0.7, 0.4, 1); }
.cell.broken.breaking .p3 { animation: s3 0.7s cubic-bezier(0.3, 0.7, 0.4, 1); }
@keyframes s1 { 0% { transform: none; opacity: 1; } 30% { transform: translate(-12%, -26%) rotate(-24deg); opacity: 1; } 100% { transform: translate(-16%, 4%) rotate(-38deg) scale(0.9); } }
@keyframes s2 { 0% { transform: none; opacity: 1; } 30% { transform: translate(16%, -34%) rotate(26deg); opacity: 1; } 100% { transform: translate(18%, 6%) rotate(34deg) scale(0.85); } }
@keyframes s3 { 0% { transform: none; opacity: 1; } 30% { transform: translate(2%, -14%) rotate(-6deg); opacity: 1; } 100% { transform: translate(2%, 8%) rotate(4deg) scale(0.8); } }

.cell.broken::after {
  content: attr(data-n);
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 0.95rem; line-height: 1;
  color: var(--navy); background: var(--paper);
  border: 2px solid var(--navy); border-radius: 99px; padding: 3px 8px;
}
.tick {
  position: absolute; top: 2px; right: 2px; display: none;
  width: 22px; height: 22px; padding: 4px; border-radius: 50%;
  background: var(--red); stroke: var(--white); stroke-width: 2.4; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}
.cell.broken .tick { display: block; }

/* ---------- answer card ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); }
.sheet {
  width: min(100%, 420px);
  background: var(--white); color: var(--navy);
  border: 3px solid var(--navy); border-radius: 18px; box-shadow: 6px 6px 0 var(--red);
  overflow: hidden;
  animation: pop 0.35s cubic-bezier(0.2, 1.2, 0.3, 1);
}
@keyframes pop { from { transform: scale(0.8) translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 18px; background: var(--blue); color: var(--white); border-bottom: 6px solid var(--red);
}
.sheet-head .lbl { font-weight: 800; font-size: 1.05rem; }
.sheet-head .big { font-family: var(--font-display); font-size: 2.1rem; line-height: 1; }
.answer {
  margin: 0; padding: 26px 18px; min-height: 8rem;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-weight: 800; font-size: clamp(1.5rem, 7vw, 2rem); line-height: 1.4;
  text-wrap: balance; overflow-wrap: anywhere;
}
.sheet-foot { display: flex; justify-content: center; padding: 0 18px 18px; }
.ok {
  font-family: var(--font-body); font-weight: 800; font-size: 1.05rem; color: var(--white);
  background: var(--red); border: 3px solid var(--navy); border-radius: 12px; box-shadow: 3px 3px 0 var(--navy);
  padding: 8px 34px; cursor: pointer;
}
.ok:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--navy); }

/* ---------- action bar ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center; gap: 10px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--white); border-top: 3px solid var(--navy);
}
.btn {
  flex: 1 1 0; max-width: 260px; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; color: var(--white); text-decoration: none;
  border: 3px solid var(--navy); border-radius: 14px; box-shadow: 3px 3px 0 var(--navy);
}
.btn.ig { background: var(--blue); }
.btn.store { background: var(--red); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--navy); }
.btn svg { flex: none; width: 26px; height: 26px; }
.btn .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.btn .t b { font-family: var(--font-display); font-weight: 400; font-size: 0.95rem; letter-spacing: 0.02em; }
.btn .t small { font-size: 0.72rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (prefers-reduced-motion: reduce) {
  .f, .sheet, .cell.wobble .jug, .cell.broken.breaking .piece { animation: none; }
  .piece, .meter i, .jug { transition: none; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="botijo" viewBox="0 0 100 106">
    <defs><clipPath id="bodyclip"><ellipse cx="50" cy="72" rx="35" ry="30"/></clipPath></defs>
    <path d="M30 54C26 6 74 6 70 54" fill="none" stroke="var(--navy)" stroke-width="10" stroke-linecap="round"/>
    <path d="M30 54C26 6 74 6 70 54" fill="none" stroke="var(--jug)" stroke-width="5" stroke-linecap="round"/>
    <polygon points="76,60 88,36 96,41 88,72" fill="var(--jug)" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="92" cy="38.5" r="2.4" fill="var(--navy)"/>
    <polygon points="24,62 13,46 20,42 30,58" fill="var(--jug)" stroke="var(--navy)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="16.5" cy="44" r="2.2" fill="var(--navy)"/>
    <rect x="32" y="99" width="36" height="7" rx="3" fill="var(--jug)" stroke="var(--navy)" stroke-width="3"/>
    <ellipse cx="50" cy="72" rx="35" ry="30" fill="var(--jug)"/>
    <g clip-path="url(#bodyclip)">
      <rect x="10" y="60" width="80" height="9" fill="var(--band)"/>
      <rect x="10" y="87" width="80" height="6" fill="var(--band)"/>
    </g>
    <ellipse cx="50" cy="72" rx="35" ry="30" fill="none" stroke="var(--navy)" stroke-width="3"/>
    <circle cx="50" cy="72" r="18" fill="var(--label)" stroke="var(--navy)" stroke-width="2.5"/>

  <span class="f b" style="left:6%;top:56%;font-size:3.6rem;--r:5deg;--d:13s">90s</span>
  <span class="f or" style="left:40%;top:66%;font-size:7rem;--r:-9deg;--d:19s">90s</span>
  <span class="f r" style="left:78%;top:78%;font-size:4rem;--r:4deg;--d:16s">90s</span>
  <span class="f ob" style="left:14%;top:86%;font-size:5.5rem;--r:-5deg;--d:18s">90s</span>
</div>

<main class="wrap">
  <header>
    <h1><span class="a">Retro</span><span class="b">Tounes</span></h1>
    <div class="ribbon"></div>
    <p class="tag" dir="rtl" lang="ar">ذكريات التسعينات التونسية</p>
    <p class="sub" dir="rtl" lang="ar">كسّر القلّة و شوف شنوّا فيها</p>
    <div class="status">
      <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="meterFill"></i></div>
      <div class="line" dir="rtl" lang="ar">
        <span id="count">كسّرت 0 من 100</span>
        <button class="reset" id="reset" type="button">ابدأ من جديد</button>

</main>

<div class="scrim" id="scrim" hidden>

    <div class="sheet-foot"><button class="ok" id="closeBtn" type="button" lang="ar">تمام</button></div>

</div>

    <span class="t"><b>Store</b><small lang="ar">تسوّق توّا</small></span>

<script>
const ANSWERS = [
  "عرفان", "شوكلاطة هلال", "Sinalco", "سول", "Yaourt Assil",
  "Yogo", "Layno", "كريمة مامي بلدي", "بشكوتو بودورو", "شقيف — مسلسل الكواسر",
  "ليالي الحلمية", "Dohn Flash", "فتحية عدالة خنشة", "Sasouki", "عماد بن يونس — شكري الواعر — عادل السليمي — زبير بية",
  "شيخ كهفان", "كرهبة الـSTEG", "افتح يا سمسم", "Clint Eastwood — Manco", "ولد الناس",
  "هالة الركبي", "رؤوف كوكة", "سي زهواني", "Décodeur متاع Récepteur", "هنريك كاسبرجاك",
  "هند صبري", "جنوب إفريقيا", "Emission Chams 3lik", "حامد القروي", "إنجلترا وكولومبيا ورومانيا",
  "1994", "1991", "فريد بوغدير", "Rai Uno", "مغامرات نيلز",
  "قبل ما تتزاد منوبة — 23 ولاية", "Video Club", "كعبول الأكول", "سنان", "404",
  "جولة في المراعي مع هايدي", "فورما", "رمضان 1996", "المنصف الأزعر", "رملة العياري",
  "رمضان شطا", "أحمد السنوسي", "الشريف العبيدي", "نور الدين بن عياد", "1994",
  "خادمة في دار الضابط إسماعيل", "نجيب الخطاب", "5 كعبات", "Tintin", "محمد قمّودي",
  "نجاة عطية", "منير بوقديدة", "فيصل بن أحمد", "خالد بدرة", "بوبكر الزيتوني",
  "نجيب الخطاب", "باريس، 1997", "BICHA W FARHOUD", "Macarena", "PANORAMA",
  "Captain Tsubasa", "سامي مبزع", "فرح بن رجب", "الهضبة", "سميرة سعيد",
  "صالح", "محمود عبد العزيز", "نور الشريف", "Middle East Broadcasting Center", "داليدا",
  "حدّة", "بومنيجل", "حياة", "رزوقة", "رامي وسلمى",
  "أنطونو أو ركال", "حمّادي الجزيري", "دحدح", "نادين / جون / جيمي", "Livres des numéros de fixe",
  "عصّارة طماطم", "كريستينا وأليخاندرو", "16H", "قوس قزح", "بطاقة تعريف مدرسية",
  "تبرّع بالدم", "FANTA", "فوازير رمضان 1996", "علي البراق", "ياغورت زياد",
  "مقرونة راندا", "سروال Fantasia", "Judy", "عايدة بوبكر", "يسرى السحراوي"
];

const KEY = "retro-tounes-broken";
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const grid = document.getElementById("grid");
const scrim = document.getElementById("scrim");
const sheetNum = document.getElementById("sheetNum");
const answerText = document.getElementById("answerText");
const closeBtn = document.getElementById("closeBtn");
const countEl = document.getElementById("count");
const meter = document.getElementById("meter");
const meterFill = document.getElementById("meterFill");
const resetBtn = document.getElementById("reset");

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(arr) ? arr.filter(n => Number.isInteger(n) && n >= 1 && n <= 100) : []);
  } catch (e) { return new Set(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify([...broken])); } catch (e) {}
}
const broken = load();

function piece(n, cls) {
  const size = n > 99 ? 13 : n > 9 ? 17 : 22;
  const y = n > 99 ? 76.5 : n > 9 ? 78 : 79.5;
  return '<svg class="piece ' + cls + '" viewBox="0 0 100 106" aria-hidden="true"><use href="#botijo"/>' +
    '<text class="num" x="50" y="' + y + '" text-anchor="middle" font-size="' + size + '">' + n + '</text></svg>';
}
const TICK = '<svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.4l2.6 2.6L9.8 3.6"/></svg>';

function label(n) {
  return broken.has(n)
    ? "قلة رقم " + n + "، الجواب: " + ANSWERS[n - 1]
    : "قلة رقم " + n;
}

let html = "";
for (let n = 1; n <= 100; n++) {
  html += '<button type="button" class="cell v' + ((n - 1) % 3) + (broken.has(n) ? " broken" : "") +
    '" data-n="' + n + '" aria-label="' + label(n) + '">' +
    '<span class="jug">' + piece(n, "p1") + piece(n, "p2") + piece(n, "p3") + '</span>' + TICK + '</button>';
}
grid.innerHTML = html;

function updateCount() {
  const c = broken.size;
  countEl.textContent = c === 100 ? "مبروك، كسّرت الـ100 قلّة" : "كسّرت " + c + " من 100";
  meterFill.style.width = c + "%";
  meter.setAttribute("aria-valuenow", String(c));
}
updateCount();

let lastFocus = null;
function openSheet(n, cell) {
  lastFocus = cell;
  sheetNum.textContent = n;
  answerText.textContent = ANSWERS[n - 1];
  scrim.hidden = false;
  closeBtn.focus();
}
function closeSheet() {
  if (scrim.hidden) return;
  scrim.hidden = true;
  if (lastFocus) lastFocus.focus();
}

function breakJug(cell, n, animate) {
  broken.add(n);
  save();
  if (animate) cell.classList.add("breaking");
  cell.classList.add("broken");
  cell.setAttribute("aria-label", label(n));
  updateCount();
}

grid.addEventListener("click", function (e) {
  const cell = e.target.closest(".cell");
  if (!cell || cell.dataset.busy) return;
  const n = Number(cell.dataset.n);
  if (broken.has(n)) { openSheet(n, cell); return; }
  if (reduce) { breakJug(cell, n, false); openSheet(n, cell); return; }
  cell.dataset.busy = "1";
  cell.classList.add("wobble");
  setTimeout(function () {
    cell.classList.remove("wobble");
    breakJug(cell, n, true);
    setTimeout(function () {
      delete cell.dataset.busy;
      openSheet(n, cell);
    }, 520);
  }, 260);
});

closeBtn.addEventListener("click", closeSheet);
scrim.addEventListener("click", function (e) { if (e.target === scrim) closeSheet(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

resetBtn.addEventListener("click", function () {
  broken.clear();
  save();
  grid.querySelectorAll(".cell").forEach(function (cell) {
    cell.classList.remove("broken", "breaking", "wobble");
    cell.setAttribute("aria-label", "قلة رقم " + cell.dataset.n);
  });
  updateCount();
});
</script>

</body></html>
